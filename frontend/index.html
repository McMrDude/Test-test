<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">

    <body>
        <h1>Fuck You World!</h1>

        <form id="form">
            <input type="text" id="text-input" placeholder="Enter text here">
            <button type="button" onclick="addText()">Submit</button>
        </form>

        <div id="shit">

        </div>
        
        <script src="" async defer>
            updateDiv();

            /* const form = document.querySelector('form'); */

            /* form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const data = new FormData(e.target) */
            async function addText() {
                await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: document.getElementById("text-input").value
                    })
                });
                console.log("Form submitted");
                updateDiv();
            };


            async function updateDiv() {
                const textres = await fetch("/text");
                const text = await textres.json();
                
                document.getElementById('shit').innerHTML = '';
                text.array.forEach((text) => {
                    document.getElementById('shit').innerHTML += `<p>${text.text}</p>`;
                });
                    console.log("updateDiv is happening")
            }
        </script>
    </body>
</html>
