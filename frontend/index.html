<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        <h1>Fuck You World!</h1>

        <form id="form">
            <input type="text" placeholder="Enter text here">
            <button type="submit" onclick="addText()">Submit</button>
        </form>

        <div id="shit">

        </div>
        
        <script src="" async defer>
            async function addText() {
                await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: document.getElementById('form').value
                    })
                });
            };


            async function updateDiv() {
                const textres = await fetch("/text");
                const text = await textres.json();

                text.array.forEach((text) => {
                    document.getElementById('shit').innerHTML = text.text;
                });
                    
            }
        </script>
    </body>
</html>
